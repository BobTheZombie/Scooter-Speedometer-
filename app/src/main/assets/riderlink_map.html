<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="leaflet.css"><style>html,body,#map{height:100%;margin:0;background:#071015}.leaflet-control-attribution{font-size:9px}.rider{background:#00e5ff;border:3px solid white;border-radius:50%;box-shadow:0 0 14px #00e5ff}.me{background:#ff8a21;border:3px solid white;border-radius:50%;box-shadow:0 0 15px #ff4d18}</style></head><body><div id="map"></div><script src="leaflet.js"></script><script>
const map=L.map('map',{zoomControl:true,preferCanvas:true}).setView([42.29,-85.59],12);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap • ALPR FlockHopper/DeFlock • Police SparrowMap'}).addTo(map);let me=null,markers=[],sosMarkers=[],hazardMarkers=[],beaconMarkers=[],flockMarkers=[],flockVisible=true,initialCameraFrame=false,policeMarkers=[];
function setMe(lat,lon){if(!me){me=L.marker([lat,lon],{icon:L.divIcon({className:'me',iconSize:[20,20]})}).addTo(map).bindPopup('You');if(!initialCameraFrame)map.setView([lat,lon],12)}else me.setLatLng([lat,lon]);updateFlockAppearance([lat,lon]);}
function setRiders(raw,lat,lon){setMe(lat,lon);markers.forEach(m=>map.removeLayer(m));markers=[];try{JSON.parse(raw).forEach(r=>{if(!r.latitude||!r.longitude)return;let icon=L.divIcon({className:'rider',iconSize:[18,18]});let m=L.marker([r.latitude,r.longitude],{icon}).addTo(map).bindPopup('<b>'+escapeHtml(r.username||'Rider')+'</b><br>'+escapeHtml(r.scooter||'Scooter')+'<br>'+Math.round(r.distance_km*0.621371*10)/10+' mi away');markers.push(m)})}catch(e){}}
function setSos(raw){sosMarkers.forEach(m=>map.removeLayer(m));sosMarkers=[];try{JSON.parse(raw).forEach(r=>{let icon=L.divIcon({html:'<b style="background:#bd1717;color:white;padding:6px;border-radius:6px">SOS</b>',className:'',iconSize:[42,24]});let nav='geo:'+r.latitude+','+r.longitude+'?q='+r.latitude+','+r.longitude;let m=L.marker([r.latitude,r.longitude],{icon}).addTo(map).bindPopup('<b>SOS • '+escapeHtml(r.username||'Rider')+'</b><br>'+escapeHtml(r.message||'Needs assistance')+'<br><a href="'+nav+'">NAVIGATE TO RIDER</a>');sosMarkers.push(m)})}catch(e){}}
function setRideBeacons(raw){beaconMarkers.forEach(m=>map.removeLayer(m));beaconMarkers=[];const style={cruising:['🛵','#00bcd4','Cruising now'],ride:['⚡','#00c853','Down to ride'],meetup:['⌖','#ff9800','Meet up'],mechanical:['🔧','#ff5252','Needs mechanical help']};try{JSON.parse(raw).forEach(r=>{let s=style[r.kind]||style.cruising;let icon=L.divIcon({className:'',iconSize:[38,38],iconAnchor:[19,19],html:'<span style="display:flex;width:34px;height:34px;align-items:center;justify-content:center;border-radius:50%;background:'+s[1]+';border:3px solid white;box-shadow:0 0 15px '+s[1]+';font-size:18px">'+s[0]+'</span>'});let m=L.marker([r.latitude,r.longitude],{icon,zIndexOffset:900}).addTo(map).bindPopup('<b>'+escapeHtml(r.username||'Rider')+' • '+s[2]+'</b><br>'+escapeHtml(r.scooter||'Scooter')+(r.note?'<br>'+escapeHtml(r.note):'')+'<br>'+Math.round(Number(r.distance_km)*0.621371*10)/10+' mi away');beaconMarkers.push(m)})}catch(e){}}
function setCommunityHazards(raw){hazardMarkers.forEach(m=>map.removeLayer(m));hazardMarkers=[];try{JSON.parse(raw).forEach(r=>{let icon=L.divIcon({html:'<b style="background:#241500;color:#ffb22e;border:2px solid #ff8b19;padding:5px;border-radius:50%">CAM</b>',className:'',iconSize:[44,28]});let m=L.marker([r.latitude,r.longitude],{icon}).addTo(map).bindPopup('<b>Rider-reported Flock camera</b><br>Unverified community report');hazardMarkers.push(m)})}catch(e){}}
function flockIcon(hot){return L.divIcon({className:'',iconSize:[hot?20:14,hot?20:14],iconAnchor:[hot?10:7,hot?10:7],html:'<span style="display:block;width:100%;height:100%;box-sizing:border-box;border-radius:50%;background:'+(hot?'#ff123d':'#670016')+';border:'+(hot?'3px solid white':'2px solid #ff385c')+';box-shadow:0 0 '+(hot?'16px #ff174f':'7px #ff385c99')+'"></span>'})}
function setFlockHopperCameras(raw){flockMarkers.forEach(m=>map.removeLayer(m));flockMarkers=[];try{JSON.parse(raw).forEach(r=>{let m=L.marker([r.latitude,r.longitude],{icon:flockIcon(false),zIndexOffset:700});m.distanceMeters=Number(r.distance_m)||999999;m.bindPopup('<b>Reported ALPR camera</b><br>Community/public-record data • '+Math.round(m.distanceMeters*0.000621371*10)/10+' mi away<br>Location may be incomplete or outdated.');m.isHot=false;flockMarkers.push(m);if(flockVisible)m.addTo(map)});document.getElementById('flockToggle').textContent='ALPR '+flockMarkers.length;if(me){updateFlockAppearance(me.getLatLng());if(!initialCameraFrame&&flockMarkers.length){let nearest=flockMarkers.slice().sort((a,b)=>a.distanceMeters-b.distanceMeters).slice(0,12);let points=[me.getLatLng()].concat(nearest.map(m=>m.getLatLng()));map.fitBounds(L.latLngBounds(points),{padding:[45,45],maxZoom:13,animate:false});initialCameraFrame=true}}}catch(e){document.getElementById('flockToggle').textContent='ALPR ERROR'}}
function updateFlockAppearance(p){flockMarkers.forEach(m=>{const hot=map.distance(p,m.getLatLng())<=152.4;if(hot!==m.isHot){m.isHot=hot;m.setIcon(flockIcon(hot))}})}
function toggleFlock(){flockVisible=!flockVisible;flockMarkers.forEach(m=>flockVisible?m.addTo(map):map.removeLayer(m));document.getElementById('flockToggle').textContent=flockVisible?'ALPR '+flockMarkers.length:'ALPR OFF'}
function setPoliceSightings(raw){policeMarkers.forEach(m=>map.removeLayer(m));policeMarkers=[];try{JSON.parse(raw).forEach(r=>{let age=Math.max(0,Number(r.age_minutes)||0);let icon=L.divIcon({className:'',iconSize:[32,32],iconAnchor:[16,16],html:'<span style="display:flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:50%;background:#142431;border:3px solid #4da3ff;box-shadow:0 0 14px #267dff;color:white;font-size:16px">★</span>'});let m=L.marker([r.latitude,r.longitude],{icon,zIndexOffset:850}).addTo(map).bindPopup('<b>Recent police vehicle sighting</b><br>Confirmed on SparrowMap • '+age+' min ago<br>Sighting may have moved.');policeMarkers.push(m)});document.getElementById('policeCount').textContent='POLICE '+policeMarkers.length}catch(e){document.getElementById('policeCount').textContent='POLICE ?'}}
const PoliceControl=L.Control.extend({options:{position:'topright'},onAdd:function(){let b=L.DomUtil.create('div');b.id='policeCount';b.textContent='POLICE 0';b.style.cssText='background:#101d24;color:#78b8ff;border:1px solid #4da3ff;border-radius:8px;padding:8px;font-weight:bold;margin-top:5px';return b}});map.addControl(new PoliceControl());
const FlockControl=L.Control.extend({options:{position:'topright'},onAdd:function(){let b=L.DomUtil.create('button');b.id='flockToggle';b.textContent='ALPR ON';b.style.cssText='background:#101d24;color:#ff607d;border:1px solid #ff385c;border-radius:8px;padding:9px;font-weight:bold';L.DomEvent.disableClickPropagation(b);L.DomEvent.on(b,'click',toggleFlock);return b}});map.addControl(new FlockControl());
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
</script></body></html>
