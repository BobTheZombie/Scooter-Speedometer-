<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="stylesheet" href="leaflet.css"><style>
html,body,#map{width:100%;height:100%;margin:0;background:#071017;overflow:hidden;overscroll-behavior:none;touch-action:none}.leaflet-control-attribution{font-size:10px}.leaflet-map-pane,.leaflet-tile-pane,.leaflet-overlay-pane{backface-visibility:hidden;transform:translateZ(0)}.leaflet-tile{outline:1px solid transparent;backface-visibility:hidden;will-change:transform}
.scooter-marker{will-change:transform}
.scooter-heading{width:46px;height:58px;transform-origin:23px 29px;filter:drop-shadow(0 3px 5px #000b)}
.scooter-glow{position:absolute;left:5px;top:11px;width:36px;height:36px;border-radius:50%;background:#00e5ff44;box-shadow:0 0 16px #00e5ff}
</style></head>
<body><div id="map"></div><script src="leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false,preferCanvas:true,zoomAnimation:false,fadeAnimation:false,markerZoomAnimation:false,inertia:true,inertiaDeceleration:3400,inertiaMaxSpeed:1700}).setView([42.2917,-85.5872],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,keepBuffer:5,updateWhenIdle:false,updateWhenZooming:false,attribution:'© OpenStreetMap • ALPR FlockHopper/DeFlock • Police sightings SparrowMap'}).addTo(map);
let rider=null,accuracy=null,route=null,first=true,flockMarkers=[],flockVisible=true,policeMarkers=[],target=null,displayed=null,follow=false,lastFrame=0,lastPan=0;
const scooterSvg='<div class="scooter-glow"></div><div class="scooter-heading"><svg viewBox="0 0 46 58" width="46" height="58"><path d="M23 1 L32 15 L29 22 L34 45 Q23 56 12 45 L17 22 L14 15 Z" fill="#ff7a18" stroke="white" stroke-width="3"/><rect x="17" y="12" width="12" height="24" rx="6" fill="#101820"/><circle cx="23" cy="9" r="5" fill="#00e5ff" stroke="white" stroke-width="2"/><rect x="19" y="45" width="8" height="11" rx="4" fill="#111"/></svg></div>';
function scooterIcon(){return L.divIcon({className:'scooter-marker',html:scooterSvg,iconSize:[46,58],iconAnchor:[23,29]})}
function updateLocation(lat,lon,bearing,meters,isFollowing){target={lat,lon,bearing,meters};follow=!!isFollowing;if(!displayed)displayed={lat,lon,bearing};if(!rider){rider=L.marker([lat,lon],{icon:scooterIcon(),zIndexOffset:1000}).addTo(map);accuracy=L.circle([lat,lon],{radius:meters,color:'#00e5ff',weight:1,fillOpacity:.07}).addTo(map);if(first){map.setView([lat,lon],17);first=false}}}
function animateRider(t){if(target&&rider){let k=Math.min(.34,Math.max(.10,(t-lastFrame)/420));displayed.lat+=(target.lat-displayed.lat)*k;displayed.lon+=(target.lon-displayed.lon)*k;let d=((target.bearing-displayed.bearing+540)%360)-180;displayed.bearing=(displayed.bearing+d*k+360)%360;let p=[displayed.lat,displayed.lon];rider.setLatLng(p);accuracy.setLatLng(p).setRadius(target.meters);const el=rider.getElement();if(el){const h=el.querySelector('.scooter-heading');if(h)h.style.transform='rotate('+displayed.bearing+'deg)'}updateFlockAppearance(p);if(follow&&t-lastPan>90){map.panTo(p,{animate:false});lastPan=t}}lastFrame=t;requestAnimationFrame(animateRider)}requestAnimationFrame(animateRider);
function setRoute(geometry){if(route)map.removeLayer(route);route=L.geoJSON({type:'Feature',properties:{},geometry:geometry},{style:{color:'#00e5ff',weight:7,opacity:.9}}).addTo(map);map.fitBounds(route.getBounds(),{padding:[55,90]})}
function startGuidance(){follow=true;if(rider)map.setView(rider.getLatLng(),17,{animate:true})}
function setFlockHopperCameras(raw){flockMarkers.forEach(m=>map.removeLayer(m));flockMarkers=[];try{JSON.parse(raw).forEach(r=>{let m=L.circleMarker([r.latitude,r.longitude],{radius:6,color:'#ff385c',weight:2,fillColor:'#5b0011',fillOpacity:.88}).bindPopup('<b>Reported ALPR camera</b><br>Community/public-record data<br>Location may be incomplete or outdated.');m.cameraKey=r.latitude.toFixed(6)+','+r.longitude.toFixed(6);flockMarkers.push(m);if(flockVisible)m.addTo(map)});if(rider)updateFlockAppearance(rider.getLatLng())}catch(e){}}
function updateFlockAppearance(p){flockMarkers.forEach(m=>{const d=map.distance(p,m.getLatLng());const hot=d<=152.4;m.setRadius(d<=75?11:hot?9:d<=400?7:6);m.setStyle({color:hot?'#fff':'#ff385c',weight:hot?3:2,fillColor:hot?'#ff173f':'#5b0011',fillOpacity:hot?1:.88})})}
function highlightFlock(lat,lon){let best=null,dist=1e9;flockMarkers.forEach(m=>{let d=map.distance([lat,lon],m.getLatLng());if(d<dist){dist=d;best=m}});if(best&&dist<30){best.setRadius(14);best.setStyle({color:'#fff',weight:4,fillColor:'#ff002f',fillOpacity:1});if(flockVisible)best.bringToFront()}}
function setPoliceSightings(raw){policeMarkers.forEach(m=>map.removeLayer(m));policeMarkers=[];try{JSON.parse(raw).forEach(r=>{let age=Math.max(0,Number(r.age_minutes)||0);let m=L.marker([r.latitude,r.longitude],{zIndexOffset:850,icon:L.divIcon({className:'',iconSize:[32,32],iconAnchor:[16,16],html:'<span style="display:flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:50%;background:#162633;border:3px solid #4da3ff;box-shadow:0 0 14px #267dff;color:white;font-size:16px">★</span>'})}).bindPopup('<b>Recent police vehicle sighting</b><br>Confirmed on SparrowMap • '+age+' min ago<br>Sighting may have moved.');policeMarkers.push(m);m.addTo(map)})}catch(e){}}
function highlightPolice(lat,lon){let best=null,dist=1e9;policeMarkers.forEach(m=>{let d=map.distance([lat,lon],m.getLatLng());if(d<dist){dist=d;best=m}});if(best&&dist<40)best.openPopup()}
function toggleFlock(){flockVisible=!flockVisible;flockMarkers.forEach(m=>flockVisible?m.addTo(map):map.removeLayer(m));document.getElementById('flockToggle').textContent=flockVisible?'ALPR ON':'ALPR OFF'}
const FlockControl=L.Control.extend({options:{position:'bottomleft'},onAdd:function(){let b=L.DomUtil.create('button');b.id='flockToggle';b.textContent='ALPR ON';b.style.cssText='background:#101d24;color:#ff607d;border:1px solid #ff385c;border-radius:8px;padding:9px;font-weight:bold;margin:0 0 62px 8px';L.DomEvent.disableClickPropagation(b);L.DomEvent.on(b,'click',toggleFlock);return b}});map.addControl(new FlockControl());
</script></body></html>
