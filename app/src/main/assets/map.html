<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<link rel="stylesheet" href="leaflet.css"><style>
html,body,#map{width:100%;height:100%;margin:0;background:#071017}.leaflet-control-attribution{font-size:10px}
.scooter-marker{transition:transform .42s linear!important}
.scooter-heading{width:46px;height:58px;transform-origin:23px 29px;filter:drop-shadow(0 3px 5px #000b)}
.scooter-glow{position:absolute;left:5px;top:11px;width:36px;height:36px;border-radius:50%;background:#00e5ff44;box-shadow:0 0 16px #00e5ff}
</style></head>
<body><div id="map"></div><script src="leaflet.js"></script><script>
const map=L.map('map',{zoomControl:false,preferCanvas:true}).setView([42.2917,-85.5872],13);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap • ALPR data FlockHopper/DeFlock'}).addTo(map);
let rider=null,accuracy=null,route=null,first=true,flockMarkers=[],flockVisible=true;
const scooterSvg='<div class="scooter-glow"></div><div class="scooter-heading"><svg viewBox="0 0 46 58" width="46" height="58"><path d="M23 1 L32 15 L29 22 L34 45 Q23 56 12 45 L17 22 L14 15 Z" fill="#ff7a18" stroke="white" stroke-width="3"/><rect x="17" y="12" width="12" height="24" rx="6" fill="#101820"/><circle cx="23" cy="9" r="5" fill="#00e5ff" stroke="white" stroke-width="2"/><rect x="19" y="45" width="8" height="11" rx="4" fill="#111"/></svg></div>';
function scooterIcon(){return L.divIcon({className:'scooter-marker',html:scooterSvg,iconSize:[46,58],iconAnchor:[23,29]})}
function updateLocation(lat,lon,bearing,meters){const p=[lat,lon];if(!rider){rider=L.marker(p,{icon:scooterIcon(),zIndexOffset:1000}).addTo(map);accuracy=L.circle(p,{radius:meters,color:'#00e5ff',weight:1,fillOpacity:.07}).addTo(map)}else{rider.setLatLng(p);accuracy.setLatLng(p).setRadius(meters)}const el=rider.getElement();if(el){const heading=el.querySelector('.scooter-heading');if(heading)heading.style.transform='rotate('+bearing+'deg)'}if(first){map.setView(p,17);first=false}else map.panTo(p,{animate:true,duration:.42,easeLinearity:.8})}
function setRoute(geometry){if(route)map.removeLayer(route);route=L.geoJSON({type:'Feature',properties:{},geometry:geometry},{style:{color:'#00e5ff',weight:7,opacity:.9}}).addTo(map);map.fitBounds(route.getBounds(),{padding:[55,90]})}
function setFlockHopperCameras(raw){flockMarkers.forEach(m=>map.removeLayer(m));flockMarkers=[];try{JSON.parse(raw).forEach(r=>{let m=L.circleMarker([r.latitude,r.longitude],{radius:6,color:'#ff385c',weight:2,fillColor:'#5b0011',fillOpacity:.88}).bindPopup('<b>Reported ALPR camera</b><br>Community/public-record data<br>Location may be incomplete or outdated.');flockMarkers.push(m);if(flockVisible)m.addTo(map)})}catch(e){}}
function toggleFlock(){flockVisible=!flockVisible;flockMarkers.forEach(m=>flockVisible?m.addTo(map):map.removeLayer(m));document.getElementById('flockToggle').textContent=flockVisible?'ALPR ON':'ALPR OFF'}
const FlockControl=L.Control.extend({options:{position:'bottomleft'},onAdd:function(){let b=L.DomUtil.create('button');b.id='flockToggle';b.textContent='ALPR ON';b.style.cssText='background:#101d24;color:#ff607d;border:1px solid #ff385c;border-radius:8px;padding:9px;font-weight:bold;margin:0 0 62px 8px';L.DomEvent.disableClickPropagation(b);L.DomEvent.on(b,'click',toggleFlock);return b}});map.addControl(new FlockControl());
</script></body></html>
