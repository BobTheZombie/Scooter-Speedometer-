<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><link rel="stylesheet" href="leaflet.css"><style>html,body,#map{height:100%;margin:0;background:#071015}.leaflet-control-attribution{font-size:8px}.tag{white-space:nowrap;color:white;background:#09232c;border:2px solid #00d9f5;border-radius:16px;padding:4px 7px;font:700 11px sans-serif;box-shadow:0 0 12px #00d9f588}.leader{border-color:#ffb300;background:#3a2500}</style></head><body><div id="map"></div><script src="leaflet.js"></script><script>
const map=L.map('map',{preferCanvas:true,zoomControl:true}).setView([42.29,-85.59],13);L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap • RiderLink+ Convoy'}).addTo(map);let riders=[],framed=false;
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setConvoy(raw){riders.forEach(x=>map.removeLayer(x));riders=[];try{let rows=JSON.parse(raw),points=[];rows.forEach(r=>{if(r.latitude==null||r.longitude==null||Number(r.age_seconds)>45)return;let lead=r.role==='leader',html='<span class="tag '+(lead?'leader':'')+'">'+(lead?'★ ':'🛵 ')+esc(r.username)+'</span>';let icon=L.divIcon({className:'',html,iconSize:[100,28],iconAnchor:[50,14]});let m=L.marker([r.latitude,r.longitude],{icon,zIndexOffset:lead?900:700}).addTo(map).bindPopup('<b>'+esc(r.username)+'</b><br>'+esc(r.scooter)+'<br>'+Math.round(Number(r.speed_mps||0)*2.2369)+' mph');riders.push(m);points.push(m.getLatLng())});if(points.length&&!framed){map.fitBounds(L.latLngBounds(points),{padding:[35,35],maxZoom:15});framed=true}}catch(e){}}
</script></body></html>
