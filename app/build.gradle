plugins { id 'com.android.application' }

android {
    def releaseStore = System.getenv("ANDROID_KEYSTORE_PATH")
    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "scooter-v8"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    namespace 'com.stankhouse.scooterspeedometer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stankhouse.scooterspeedometer'
        minSdk 23
        targetSdk 35
        versionCode 101
        versionName '9.0.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.v8test'
            versionNameSuffix '-test'
        }
        release {
            if (releaseStore) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
