plugins { id 'com.android.application' }

configurations.configureEach {
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

android {
    def releaseStore = System.getenv("ANDROID_KEYSTORE_PATH")
    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "scooter-v8"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
            }
        }
    }

    namespace 'com.stankhouse.scooterspeedometer'
    compileSdk 36
    buildFeatures { buildConfig true }
    flavorDimensions 'distribution'
    productFlavors {
        github { dimension 'distribution'; buildConfigField 'boolean', 'PLAY_STORE_BUILD', 'false' }
        play { dimension 'distribution'; buildConfigField 'boolean', 'PLAY_STORE_BUILD', 'true' }
    }

    defaultConfig {
        applicationId 'com.stankhouse.scooterspeedometer'
        minSdk 23
        targetSdk 36
        versionCode 103
        versionName '9.2.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.v8test'
            versionNameSuffix '-test'
        }
        release {
            if (releaseStore) signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
