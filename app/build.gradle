plugins { id 'com.android.application' }

android {
    namespace 'com.stankhouse.scooterspeedometer'
    compileSdk 35

    defaultConfig {
        applicationId 'com.stankhouse.scooterspeedometer'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }
}
