name: Publish v7.9 release

on:
  push:
    branches: [main]
    paths:
      - release/v7.9/apk.part04

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        run: |
          cat release/v7.9/apk.part* > apk.b64
          base64 --decode apk.b64 > Scooter-Speedometer-v7.9.apk
          echo "62c71b703f09de6286afb517e2740529aec6b003a2f8a1e46aa8156727e89f21  Scooter-Speedometer-v7.9.apk" | sha256sum --check -
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v7.9 Scooter-Speedometer-v7.9.apk --title "Scooter Speedometer v7.9" --notes-file - <<'NOTES'
          OpenNAV+ Offline update

          - Download compact 1, 3, or 5 mile OSM road/address regions
          - Search downloaded addresses without signal
          - Continue turn guidance from the cached route during network loss
          - Automatically recover and refresh routing when service returns
          - Configurable 64–512 MB navigation cache with one-tap cleanup
          - Local recent destinations and long-press favorites
          - Report missing addresses through an OpenStreetMap note
          - Scooter-safe routing option avoids motorways and toll roads
          - Seven complete dashboard themes: Classic, Inferno, Neon Grid, Retro Amber, Arctic Glass, Synthwave, and Midnight OLED

          Android 6.0+ • versionCode 61
          NOTES
