name: Publish v8.6.0 RiderLink+ membership release

on:
  push:
    branches: [v8-rider-copilot]
    paths:
      - .github/workflows/publish-v8.6.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEY_PASSWORD: ${{ secrets.V8_SIGNING_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/v8-release-key.p12
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8-rider-copilot
          fetch-depth: 0
      - name: Restore permanent signing key
        run: |
          test -n "$KEY_PASSWORD"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/v8-release-key.p12.enc -out "$KEYSTORE_PATH" -pass env:KEY_PASSWORD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build signed APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/v8-release-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.V8_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: scooter-v8
          ANDROID_KEY_PASSWORD: ${{ secrets.V8_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Verify and publish
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Scooter-Speedometer-v8.6.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs dist/Scooter-Speedometer-v8.6.0.apk
          sha256sum dist/Scooter-Speedometer-v8.6.0.apk > dist/Scooter-Speedometer-v8.6.0.apk.sha256
          gh release create v8.6.0 \
            dist/Scooter-Speedometer-v8.6.0.apk dist/Scooter-Speedometer-v8.6.0.apk.sha256 \
            --target v8-rider-copilot --title "Scooter Speedometer v8.6 • RiderLink+ Membership" \
            --notes-file - <<'NOTES'
          - Server-authenticated RiderLink+ memberships
          - One-use Founder codes locked to the redeeming account
          - Free lifetime, founder-price eligibility, and complimentary tiers
          - Hidden Founder Code Manager restricted to authorized developer accounts
          - Permanent unlimited developer entitlement for BobTheZombie
          - Hashed codes, automatic expiration, revocation support, audit records, and RLS
          - Membership badge and status inside the RiderLink profile
          - Includes v8.5.1 live street name and smoothed eight-direction road compass

          Run supabase/riderlink_membership_v86.sql before redeeming codes.
          Android 6.0+ • versionCode 91
          NOTES
      - name: Remove plaintext signing key
        if: always()
        run: rm -f "$KEYSTORE_PATH"
