name: Publish v7.6 release
on:
  push:
    branches: [main]
    paths: [release/Scooter-Speedometer-v7.6.apk.b64]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct signed APK
        run: base64 --decode release/Scooter-Speedometer-v7.6.apk.b64 > Scooter-Speedometer-v7.6.apk
      - name: Verify checksum
        run: echo "2cde3fcd66bd36e97c0dd7e9000621a943c49cce33c13a28a52ef71153994edb  Scooter-Speedometer-v7.6.apk" | sha256sum --check
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v7.6 Scooter-Speedometer-v7.6.apk \
            --title "Scooter Speedometer v7.6" \
            --notes "Hardware-accelerated built-in navigation rendering, smoother map interaction, graphical glitch fixes, and a signed GitHub Releases updater."
