name: Publish v8.5.0 RiderLink+ release

on:
  push:
    branches: [v8-rider-copilot]
    paths:
      - .github/workflows/publish-v8.5.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KEY_PASSWORD: ${{ secrets.V8_SIGNING_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/v8-release-key.p12
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v8-rider-copilot
          fetch-depth: 0

      - name: Validate permanent signing configuration
        shell: bash
        run: |
          test -n "$KEY_PASSWORD" || { echo "::error::V8_SIGNING_PASSWORD is missing"; exit 1; }
          test -f signing/v8-release-key.p12.enc || { echo "::error::Encrypted v8 signing key is missing"; exit 1; }
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/v8-release-key.p12.enc \
            -out "$KEYSTORE_PATH" \
            -pass env:KEY_PASSWORD

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build signed v8.5 APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/v8-release-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.V8_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: scooter-v8
          ANDROID_KEY_PASSWORD: ${{ secrets.V8_SIGNING_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify and stage release
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Scooter-Speedometer-v8.5.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose --print-certs dist/Scooter-Speedometer-v8.5.0.apk
          sha256sum dist/Scooter-Speedometer-v8.5.0.apk \
            > dist/Scooter-Speedometer-v8.5.0.apk.sha256

      - name: Publish GitHub release
        shell: bash
        run: |
          gh release create v8.5.0 \
            dist/Scooter-Speedometer-v8.5.0.apk \
            dist/Scooter-Speedometer-v8.5.0.apk.sha256 \
            --target v8-rider-copilot \
            --title "Scooter Speedometer v8.5 • RiderLink+" \
            --notes-file - <<'NOTES'
          RiderLink+ social-riding release

          - Temporary Ride Beacons: Cruising, Down to ride, Meet up, and Mechanical help
          - Distinct live-map Beacon graphics with rider, scooter, note, and distance
          - Privacy-blurred Beacon positions that expire automatically after 1–2 hours
          - One-tap Rider Waves with a ten-minute anti-spam cooldown
          - RiderLink activity inbox with Wave-back actions
          - Beacon sharing remains explicit and independent from the permanent LIVE switch
          - Existing RiderLink friends, clubs, chat, group rides, SOS, avatars, and garage remain intact
          - Secure Google, Facebook, and email sign-in
          - Signed with the permanent v8 release identity

          Important: run supabase/riderlink_live_v85.sql once in the Supabase SQL editor before using RiderLink+ Beacons or Waves.

          Android 6.0+ • versionCode 89
          NOTES

      - name: Remove plaintext signing key
        if: always()
        shell: bash
        run: rm -f "$KEYSTORE_PATH"
