name: Publish v7.8 updater test

on:
  push:
    branches: [main]
    paths:
      - release/v7.8/apk.part04

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify APK
        run: |
          cat release/v7.8/apk.part* > apk.b64
          base64 --decode apk.b64 > Scooter-Speedometer-v7.8.apk
          echo "9d21e5a875b14067538d327275a40dde34f8ce70a0ccdc8b59ca88ddafbcadfe  Scooter-Speedometer-v7.8.apk" | sha256sum --check -
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v7.8 >/dev/null 2>&1; then
            gh release upload v7.8 Scooter-Speedometer-v7.8.apk --clobber
          else
            gh release create v7.8 Scooter-Speedometer-v7.8.apk --title "Scooter Speedometer v7.8" --notes "OpenNAV+ address discovery update. Adds Photon autocomplete and U.S. Census fallback geocoding for addresses missing from OpenStreetMap search. Published as an in-app updater test."
          fi
