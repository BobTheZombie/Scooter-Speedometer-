name: Android v8 CI

on:
  push:
    branches: [v8-rider-copilot]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile GitHub and Play builds
        run: gradle --no-daemon :app:assembleGithubDebug :app:bundlePlayRelease
      - uses: actions/upload-artifact@v4
        with:
          name: Scooter-Speedometer-v8-debug
          path: app/build/outputs/apk/github/debug/app-github-debug.apk
          if-no-files-found: error
          retention-days: 14
