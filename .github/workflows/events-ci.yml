name: RiderLink Events checks
on:
  push:
    branches: [riderlink-events]
  pull_request:
    branches: [v8-rider-copilot]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RiderLink-Events-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
  event-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: events_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: events_test
    steps:
      - uses: actions/checkout@v4
      - name: Install schemas and test event access
        run: |
          psql -v ON_ERROR_STOP=1 -f tests/events_bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/riderlink.sql
          psql -v ON_ERROR_STOP=1 -f supabase/riderlink_membership_v86.sql
          psql -v ON_ERROR_STOP=1 -f supabase/riderlink_events.sql
          psql -v ON_ERROR_STOP=1 -f supabase/riderlink_events.sql
          psql -v ON_ERROR_STOP=1 -f tests/events_permissions.sql
          psql -v ON_ERROR_STOP=1 -f supabase/riderlink_ride_nights_v90.sql
          psql -v ON_ERROR_STOP=1 -f supabase/riderlink_ride_nights_v90.sql
          psql -v ON_ERROR_STOP=1 -f tests/ride_nights_v90_permissions.sql
