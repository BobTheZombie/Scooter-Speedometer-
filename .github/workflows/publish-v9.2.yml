name: Publish v9.2.0 Play Store readiness release

on:
  push:
    branches: [v8-rider-copilot]
    paths:
      - .github/workflows/publish-v9.2.yml
      - app/build.gradle

permissions:
  contents: write

concurrency:
  group: publish-v9.2.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEY_PASSWORD: ${{ secrets.V8_SIGNING_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/v8-release-key.p12
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Android 16 SDK
        run: $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Restore permanent signing key
        run: |
          test -n "$KEY_PASSWORD"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in signing/v8-release-key.p12.enc -out "$KEYSTORE_PATH" -pass env:KEY_PASSWORD
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed GitHub APK and Play bundle
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/v8-release-key.p12
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.V8_SIGNING_PASSWORD }}
          ANDROID_KEY_ALIAS: scooter-v8
          ANDROID_KEY_PASSWORD: ${{ secrets.V8_SIGNING_PASSWORD }}
        run: gradle --no-daemon clean :app:assembleGithubRelease :app:bundlePlayRelease
      - name: Verify and publish
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/github/release/app-github-release.apk dist/Scooter-Speedometer-v9.2.0.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab dist/Scooter-Speedometer-v9.2.0-play.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs dist/Scooter-Speedometer-v9.2.0.apk > dist/signature.txt
          cat dist/signature.txt
          expected=$(sed 's/.*SHA256: //' signing/v8-release-fingerprint.txt | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          actual=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' dist/signature.txt | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')
          test -n "$expected"
          test "$actual" = "$expected"
          jarsigner -verify -strict dist/Scooter-Speedometer-v9.2.0-play.aab
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/Scooter-Speedometer-v9.2.0.apk > dist/package.txt
          grep -q "package: name='com.stankhouse.scooterspeedometer' versionCode='103' versionName='9.2.0'" dist/package.txt
          (cd dist && sha256sum Scooter-Speedometer-v9.2.0.apk Scooter-Speedometer-v9.2.0-play.aab > SHA256SUMS)
          gh release create v9.2.0 \
            dist/Scooter-Speedometer-v9.2.0.apk dist/Scooter-Speedometer-v9.2.0-play.aab dist/SHA256SUMS \
            supabase/riderlink_play_billing_v92.sql \
            --target "$GITHUB_SHA" --title "Scooter Speedometer v9.2 • Founding Riders" \
            --notes-file - <<'NOTES'
          - Google Play Billing 9.1 with server-verified and restorable purchases
          - Founding 1,000: $9.99 Pro purchase grants lifetime RiderLink+
          - Post-founder catalog: $4.99 lifetime Pro and $6.99/month RiderLink+
          - Atomic Supabase founder counter and replay-resistant purchase-token records
          - Developer unlimited access and existing membership codes preserved
          - Android 16 / API 36 target and signed Play App Bundle
          - Separate Play flavor removes APK self-install permission and uses Play updates

          Before uploading the AAB, configure the three products, deploy the attached SQL and verification Edge Function, and add the Google Play service-account secret described in docs/PLAY_STORE_RELEASE.md.
          Android 6.0+ • versionCode 103
          NOTES
      - name: Remove plaintext signing key
        if: always()
        run: rm -f "$KEYSTORE_PATH"
